[project]
name = "llm-agent"
version = "0.1.0"
description = "Terminal LLM-agent rule manager"
readme = "README.md"
authors = [
    { name = "hsrkl", email = "hrishikesh_l@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
llm-agent = "llm_agent:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
